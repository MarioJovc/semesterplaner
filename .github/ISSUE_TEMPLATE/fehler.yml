name: Fehler melden
description: Etwas funktioniert nicht, wird falsch angezeigt oder ein Modul fehlt
labels: ["Fehler"]
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Melden. Bitte lade keinen exportierten Plan mit deinem Studienstand hoch – eine kurze Beschreibung oder ein Screenshot ohne persönliche Angaben reicht meist.
  - type: dropdown
    id: wo
    attributes:
      label: Wo nutzt du den Semesterplaner?
      options:
        - Online auf der Projektseite
        - Als heruntergeladene Datei
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser und Gerät
      placeholder: z. B. Firefox auf Windows, Safari auf dem iPhone
  - type: textarea
    id: was
    attributes:
      label: Was ist passiert?
      description: Was hast du gemacht, was ist passiert, was hättest du erwartet?
    validations:
      required: true
