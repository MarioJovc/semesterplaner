name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prüfen, dass die App nichts aus dem Netz lädt
        run: |
          if grep -nEo '<(script|link|img|iframe|source)[^>]*(src|href)="(https?:)?//[^"]*"|url\(["'"'"']?(https?:)?//[^)]*\)|@import' Semesterplaner.html; then
            echo "::error file=Semesterplaner.html::Die App bindet externe Dateien ein. Sie soll als eine Datei offline laufen."
            exit 1
          fi
      - name: Projektseite und App zusammenstellen
        run: |
          mkdir -p _site/app
          cp -r docs/. _site/
          cp Semesterplaner.html _site/app/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
